<title>优选好品 · 透明档案原型</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#E9ECF1;color:#14161A;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
#app{max-width:430px;margin:0 auto;min-height:100vh;background:#F5F6F8;position:relative;
  display:flex;flex-direction:column;box-shadow:0 0 60px rgba(20,22,26,.16)}
@media(min-width:431px){#app{min-height:100vh;border-left:1px solid #DDE2EA;border-right:1px solid #DDE2EA}}

/* status bar */
.sb{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;
  font-size:15px;font-weight:600;flex:0 0 auto}
.sb .r{display:flex;align-items:center;gap:6px}
.batt{width:24px;height:12px;border:1.4px solid #14161A;border-radius:3.5px;position:relative;opacity:.85}
.batt:after{content:"";position:absolute;right:-3.5px;top:3px;width:2px;height:4px;background:#14161A;border-radius:0 1px 1px 0}
.batt i{position:absolute;left:1px;top:1px;bottom:1px;width:70%;background:#14161A;border-radius:1.5px}

/* header */
.hd{padding:6px 20px 12px;flex:0 0 auto}
.hd .kick{font-size:11px;letter-spacing:.14em;color:#8A93A3;text-transform:uppercase;font-weight:700}
.hd h1{margin:2px 0 0;font-size:26px;letter-spacing:-.02em;font-weight:800}
.hd .sub{margin-top:6px;font-size:12.5px;color:#7A828F;line-height:1.5}
.body{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px 100px}

/* tabbar */
.tabs{position:sticky;bottom:0;flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border-top:1px solid #E2E6EE;
  padding:6px 4px calc(22px + env(safe-area-inset-bottom,0px));z-index:20}
.tabs button{border:0;background:transparent;padding:5px 0 3px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:#9AA1AC;font-size:10px;font-weight:600;cursor:pointer;transition:.15s}
.tabs button.on{color:#0B6B5B}
.tabs svg{width:22px;height:22px}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:128px;height:5px;border-radius:3px;background:#14161A;opacity:.22;z-index:30;pointer-events:none}

/* generic card */
.c{background:#fff;border-radius:18px;padding:15px 16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(20,22,26,.05)}
.c h3{margin:0 0 3px;font-size:15px;font-weight:750;letter-spacing:-.01em}
.c p{margin:0;font-size:12.5px;color:#7A828F;line-height:1.6}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ttl{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;color:#9AA1AC;letter-spacing:.08em;margin:16px 4px 8px}
.ttl:after{content:"";flex:1;height:1px;background:#E2E6EE}

/* notice */
.notice{background:linear-gradient(135deg,#FDF3E6,#FFF9F1);border:1px solid #F2DFC4;border-radius:16px;
  padding:12px 14px;margin-bottom:12px;font-size:12.5px;line-height:1.6;color:#7A5A2A}
.notice b{color:#5C4318}

/* chips */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 4px 12px;margin:0 -14px 4px;padding-left:14px;padding-right:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid #DDE2EA;background:#fff;border-radius:20px;padding:7px 13px;font-size:12.5px;
  font-weight:600;color:#4A5262;white-space:nowrap;cursor:pointer;transition:.15s}
.chip.on{background:#0B6B5B;border-color:#0B6B5B;color:#fff}
.chip small{font-weight:500;opacity:.7;margin-left:3px}

/* state pills */
.st{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:2.5px 7px;border-radius:6px}
.st.ok{background:#E4F5EC;color:#0F7A4A}
.st.pend{background:#FDF0DC;color:#9A6512}
.st.exp{background:#EEF0F3;color:#8A93A3;text-decoration:none}
.st.na{background:#F3E8F5;color:#7A4A86}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor}

/* product row */
.pr{display:flex;gap:12px;align-items:center;padding:14px 14px;background:#fff;border-radius:18px;margin-bottom:10px;
  box-shadow:0 1px 2px rgba(20,22,26,.05);cursor:pointer;border:1px solid transparent;transition:.15s}
.pr:active{transform:scale(.99)}
.pr.sel{border-color:#0B6B5B;box-shadow:0 0 0 3px rgba(11,107,91,.1)}
.th{width:52px;height:52px;border-radius:14px;flex:0 0 auto;display:grid;place-items:center;font-size:24px;background:#F2F5F8}
.pr .n{font-size:14.5px;font-weight:700;line-height:1.35;letter-spacing:-.01em}
.pr .m{font-size:11.5px;color:#8A93A3;margin-top:3px;line-height:1.45}
.pr .v{text-align:right;flex:0 0 auto}
.pr .v b{display:block;font-size:16px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pr .v span{font-size:10.5px;color:#8A93A3;display:block;margin-top:2px}
.ck{width:20px;height:20px;border-radius:50%;border:1.8px solid #D2D8E2;flex:0 0 auto;display:grid;place-items:center}
.ck.on{background:#0B6B5B;border-color:#0B6B5B;color:#fff}

/* cost bar */
.bar{display:flex;height:34px;border-radius:9px;overflow:hidden;margin:12px 0 10px}
.bar div{display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700;min-width:0;transition:.2s}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.lg div{display:flex;align-items:baseline;gap:6px;font-size:11.5px;color:#5A6272;padding:5px 0;border-bottom:1px dashed #EDF0F4}
.lg span{width:8px;height:8px;border-radius:2.5px;flex:0 0 auto;align-self:center}
.lg em{font-style:normal;flex:1}
.lg b{font-variant-numeric:tabular-nums;font-weight:750;color:#14161A}

/* timeline */
.tl{position:relative;padding-left:20px}
.tl:before{content:"";position:absolute;left:5px;top:8px;bottom:14px;width:1.5px;background:#E2E6EE}
.nd{position:relative;margin-bottom:14px}
.nd:before{content:"";position:absolute;left:-20px;top:5px;width:11px;height:11px;border-radius:50%;background:#fff;border:2.5px solid #0B6B5B}
.nd.exp:before{border-color:#C6CCD6}
.nd.pend:before{border-color:#E0A63C}
.nd .t{font-size:11px;color:#9AA1AC;font-weight:600;font-variant-numeric:tabular-nums}
.nd .h{font-size:13.5px;font-weight:700;margin-top:2px}
.nd .d{font-size:11.5px;color:#7A828F;margin-top:3px;line-height:1.5}
.doc{margin-top:7px;background:#F6F8FA;border:1px solid #E8EDF3;border-radius:10px;padding:8px 10px;font-size:11px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer}
.doc:active{background:#EEF2F7}
.doc i{font-style:normal;color:#3A4252;font-weight:600}
.doc s{color:#A8B0BC;font-variant-numeric:tabular-nums}
.doc.gone{background:#F4F5F7;border-color:#E7E9EE;opacity:.62}
.doc.gone i{text-decoration:line-through;color:#8A93A3}

/* table */
table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:600;color:#9AA1AC;font-size:10.5px;padding:0 6px 7px 0;letter-spacing:.04em;border-bottom:1px solid #E8EDF3}
td{padding:8.5px 6px 8.5px 0;border-bottom:1px solid #F2F5F8;color:#3A4252;line-height:1.35}
td:last-child,th:last-child{text-align:right;padding-right:0}
tr:last-child td{border-bottom:0}
td.hi{color:#0F7A4A;font-weight:750}
td.lo{color:#9A6512;font-weight:750}
td b{font-weight:750;color:#14161A}

/* ingredients */
.ing{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ing .i{display:flex;align-items:center;gap:10px;font-size:12.5px}
.ing .rk{width:20px;height:20px;border-radius:6px;background:#EEF2F7;color:#5A6272;font-size:10.5px;font-weight:800;display:grid;place-items:center;flex:0 0 auto}
.ing .nm{font-weight:650;flex:0 0 auto;min-width:96px}
.ing .ds{color:#8A93A3;font-size:11.5px;line-height:1.45}
.pct{height:5px;border-radius:3px;background:#EDF0F4;flex:1;min-width:24px;overflow:hidden}
.pct i{display:block;height:100%;background:#0B6B5B;border-radius:3px}

/* buttons */
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;
  background:#0B6B5B;color:#fff;font-family:inherit}
.btn.g{background:#EEF1F5;color:#2A3140}
.btn.o{background:#fff;border:1px solid #DDE2EA;color:#3A4252}
.btn.d{background:#fff;color:#B4232C;border:1px solid #F0D2D4}
.btnrow{display:flex;gap:9px;margin-top:4px}

/* sheet */
.mask{position:absolute;inset:0;background:rgba(20,22,26,.42);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:10px 20px 34px;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);z-index:50;max-height:82%;overflow-y:auto}
.sheet.on{transform:translateY(0)}
.grab{width:36px;height:4px;border-radius:2px;background:#DDE2EA;margin:0 auto 14px}
.sheet h4{margin:0 0 4px;font-size:17px;font-weight:750}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #F2F5F8;font-size:13px}
.kv span{color:#8A93A3;flex:0 0 auto}
.kv b{font-weight:650;text-align:right;line-height:1.4}
textarea{width:100%;border:1px solid #DDE2EA;border-radius:12px;padding:11px;font-size:13.5px;font-family:inherit;
  resize:none;height:78px;margin-top:8px;background:#FAFBFC;color:#14161A}
textarea:focus{outline:none;border-color:#0B6B5B;background:#fff}
.opt{display:flex;align-items:center;gap:9px;padding:10px 0;font-size:13.5px;border-bottom:1px solid #F2F5F8}

/* misc */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:8px;background:#EEF2F7;color:#4A5262}
.mini{font-size:11px;color:#9AA1AC;line-height:1.5}
.big{font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.big em{font-style:normal;font-size:13px;font-weight:650;color:#8A93A3;margin-left:3px}
.stack{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;color:#0B6B5B;font-size:14px;font-weight:650;padding:8px 6px 8px 0;margin-left:-6px;cursor:pointer;font-family:inherit}
.hint{background:#F1F5F8;border-left:3px solid #C6D6E2;border-radius:0 10px 10px 0;padding:10px 12px;font-size:11.5px;color:#5A6272;line-height:1.6;margin-bottom:12px}
.gauge{height:6px;border-radius:3px;background:#EDF0F4;overflow:hidden;margin-top:6px}
.gauge i{display:block;height:100%;border-radius:3px;background:#0F7A4A}
.gauge i.w{background:#E0A63C}
.fade{animation:fu .25s ease}
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 安装到主屏幕后：真实状态栏接管，隐藏模拟元素并让出安全区 */
@media (display-mode: standalone){
  .sb{display:none}
  .hd{padding-top:calc(14px + env(safe-area-inset-top,0px))}
  .homebar{display:none}
  #app{box-shadow:none;border:0}
  body{background:#F5F6F8}
}
/* 安装引导条 */
.inst{display:none;position:fixed;top:0;left:0;right:0;z-index:60;background:#14161A;color:#fff;
  padding:11px 16px;font-size:12.5px;line-height:1.5;text-align:center}
.inst b{color:#7CC4B7}
.inst.show{display:block}
@media (display-mode:standalone){.inst{display:none!important}}
</style>

function d(s){return new Date(s+'T23:59:00+08:00')}
function expOf(s){const x=d(s);return{gone:x<NOW,day:Math.round((x-NOW)/86400000)}}
function esc(t){return String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
/* 最新单据到期天数（用于时效排序） */
function fresh(p){let min=9999;p.tests.forEach(t=>{const e=expOf(t[6]);if(!e.gone&&e.day<min)min=e.day});return min}
/* 实测 vs 限值（仅按标准数值方向，不做健康结论） */
function passTest(actual,limit){
  if(limit==='—') return true;
  if(limit==='不得检出') return /未检出|合格/.test(actual);
  if(limit[0]==='≥') return parseFloat(actual)>=parseFloat(limit.slice(1));
  if(limit[0]==='≤') return parseFloat(actual.replace(/[^\d.<]/g,''))<=parseFloat(limit.slice(1));
  return true;
}

 ];

 const t=e.target;
 const tabBtn=t.closest('.tabs button'); if(tabBtn) return go(tabBtn.dataset.t);
 const chip=t.closest('.chip');
 if(chip){ if(chip.dataset.cat){cat=chip.dataset.cat} else {sortK=chip.dataset.sort} return draw(); }
 const ckk=t.closest('[data-ck]');
 if(ckk){e.stopPropagation();const id=ckk.dataset.ck;
   if(sel.includes(id)) sel=sel.filter(x=>x!==id);
   else if(sel.length<3) sel.push(id);
   return draw(); }
 const pr=t.closest('.pr');
 if(pr){pid=pr.dataset.p;draw();return;}
 const dc=t.closest('.doc'); if(dc){const[a,b,c,st]=dc.dataset.doc.split('|');const ex=expOf(c);
   return sheet(`<h4>${esc(a)}</h4><div class="kv"><span>单据编号</span><b>${esc(b)}</b></div>
   <div class="kv"><span>出具方</span><b>${esc(P.find(p=>p.id===pid).comp.工商.split(' / ')[0])}</b></div>
   <div class="kv"><span>公示至</span><b>${esc(c)}</b></div>
   <div class="kv"><span>状态</span><b>${ex.gone?'⚠️ 已过公示期，原图留存 3 年':(st==='pend'?'待人工复核':'在效内')}</b></div>
   <div class="kv"><span>复核方式</span><b>编号回查 + 抽查原件照片</b></div>
   <p style="margin-top:12px;font-size:12px;color:#8A93A3;line-height:1.6">真实版本此处展示单据原件（打码敏感字段）与存证哈希，用户可自行向出证机构核验。</p>
   <div class="btnrow" style="margin-top:16px"><button class="btn d" data-act="report" style="flex:1">这份单据有问题</button>
   <button class="btn g" data-act="close" style="flex:1">关闭</button></div>`); }
 const act=t.closest('[data-act]'); if(act){const a=act.dataset.act;
   if(a==='back'){pid=null;return draw()}
   if(a==='close')return close();
   if(a==='gotab'){close();return go(act.dataset.t)}
   if(a==='clear'){sel=[];close();return draw()}
   if(a==='addcmp'){if(!sel.includes(pid))sel.push(pid);pid=null;tab='cmp';close();return draw()}
   if(a==='method')return sheet(`<h4>榜单算法</h4>
     <p style="margin-top:2px">排序完全可复现，无付费位、无个性化加权。</p>
     ${SORTS.map(s=>`<div class="kv"><span>${s.l}</span><b style="font-size:11.5px">${s.note}</b></div>`).join('')}
     <div class="kv"><span>并列处理</span><b>按检测项覆盖数、再按单据公开率</b></div>
     <div class="kv"><span>剔除规则</span><b>核心单据过期 &gt;30 天自动下沉并标注</b></div>
     <button class="btn g" style="margin-top:18px" data-act="close">知道了</button>`);
   if(a==='report')return sheet(`<h4>举报数据问题</h4><p style="font-size:12.5px;color:#7A828F">抽查结果会在平台透明页公示，包括我方判断错误的情况。</p>
     ${['单据造假','实测值与报告不符','产地/工厂信息不实','价格成本虚标','用工或处罚信息隐瞒'].map(x=>`<div class="opt"><input type="radio" name="rt"> ${x}</div>`).join('')}
     <textarea placeholder="补充说明：越具体越容易核查（批次号、时间节点、你看到的矛盾）"></textarea>
     <button class="btn" style="margin-top:14px" data-act="close">提交举报</button>
     <button class="btn o" style="margin-top:8px" data-act="close">先取消</button>`);
   if(a==='dl')return sheet(`<h4>下载原始台账</h4><div class="kv"><span>2026-09 收支明细</span><b>CSV · 42 KB</b></div>
   <div class="kv"><span>外包分拣实付表</span><b>CSV · 118 KB</b></div>
   <div class="kv"><span>盲样送检批次清单</span><b>CSV · 26 KB</b></div>
   <p style="margin-top:12px;font-size:12px;color:#8A93A3">真实版本此处直接调起系统分享面板（iOS UIActivityViewController）。</p>
   <button class="btn g" style="margin-top:16px" data-act="close">关闭</button>`);
 }
});
$('#mask').addEventListener('click',close);
document.addEventListener('touchmove',e=>{ if(e.target.closest('.sheet')) e.stopPropagation(); },{passive:true});
try{
 const solo=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
 if(!solo){
   if(!localStorage.getItem('yx_hide_inst')) $('#inst').classList.add('show');
   setTimeout(()=>{const x=$('#instx');x&&x.addEventListener('click',()=>{
     $('#inst').classList.remove('show');localStorage.setItem('yx_hide_inst','1')})},200);
 }
}catch(e){}
setInterval(()=>{const n=new Date();$('#clock').textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')},1000);
draw();
</script>
</body>
</html>
